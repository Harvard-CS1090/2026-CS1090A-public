# CS1090A Section 10 environment -- run the notebook with uv (https://docs.astral.sh/uv/):
#
#   uv sync
#   uv run jupyter lab
#
# Deliberately narrow: exactly what the section notebook imports, and
# nothing else. A section notebook is a 60-minute artifact that a TF may need to
# stand up on a strange laptop ten minutes before class -- it should not pull the
# whole course stack (~2.4G) to do it. Students who want parity with FASOnDemand
# should use the `full` extra in the HW0 pyproject instead.
#
# Upper bounds keep a mid-semester release from surprising a TF between sections.
[project]
name = "cs1090a-sec10"
version = "2026.0"
description = "CS1090A Fall 2026 Section 10 -- decision trees"
requires-python = ">=3.12,<3.14"

dependencies = [
    "numpy>=2.3,<3",
    "pandas>=3,<4",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13.2,<0.14",
    "scikit-learn>=1.9,<2",
    "jupyterlab>=4",
]

# Only needed to rebuild the student notebook or export the .md renderings --
# not to run the section.
[project.optional-dependencies]
authoring = [
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

# Optional: a coding assistant inside JupyterLab (the notebook-intelligence extension).
# Nothing in this section needs it, and it adds about 50 more packages, so uv installs
# it only when you ask for it:
#
#   uv sync --extra ai-tools
#
# The assistant works by running the Claude Code command-line program, and this extra
# does not give you a `claude` command. Install it separately
# (curl -fsSL https://claude.ai/install.sh | bash) and check that typing `claude` in a
# terminal starts it before you start JupyterLab.
ai-tools = [
    "notebook-intelligence>=6.1,<7",
]
