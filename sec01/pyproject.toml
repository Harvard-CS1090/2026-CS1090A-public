# CS1090A Section 1 environment -- run the notebook with uv (https://docs.astral.sh/uv/):
#
#   uv sync
#   uv run jupyter lab
#
# Deliberately narrow: exactly what the section notebook imports, and
# nothing else. A section notebook is a 75-minute artifact that a TF may need to
# stand up on a strange laptop ten minutes before class -- it should not pull the
# whole course stack (~2.4G) to do it. Students who want parity with FASOnDemand
# should use the `full` extra in the HW0 pyproject instead.
#
# No pandas. Section 1 runs before Lecture 2 and stops at a list-of-dicts written
# to JSON; DataFrames arrive in Lecture 2 and Section 2. If you find yourself
# adding pandas here, the notebook has drifted out of its slot.
#
# Upper bounds keep a mid-semester release from surprising a TF between sections.
[project]
name = "cs1090a-sec01"
version = "2026.0"
description = "CS1090A Fall 2026 Section 1 -- web scraping, caching, and reproducibility"
requires-python = ">=3.12,<3.14"

dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<7",
    "matplotlib>=3.10,<4",
    "httpx>=0.27,<0.29",
    "jupyterlab>=4",
]

# Only needed to rebuild the student/solutions notebooks -- not to run the section.
[project.optional-dependencies]
authoring = [
    "nbconvert>=7.16",
    "nbformat>=5.10",
]
